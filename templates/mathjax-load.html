<script type="text/javascript">window.MathJax = {{ mathjax_config() }};</script>
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.0/es5/tex-chtml.min.js"></script>
<script type="text/javascript">
    {#- With ui/safe, MathJax finishes starting up only after loading that extension: until then there is no
        typesetPromise (round 2 of the adversarial review, 2026-10-28). #}
    MathJax.startup.promise.then(function () {
        return MathJax.typesetPromise();
    }).then(function () {
        $('.tex-image').hide();
        $('.tex-text').show();
    });
</script>
