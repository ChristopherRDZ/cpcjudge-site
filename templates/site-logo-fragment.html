{% if request.in_contest and request.participation.contest.logo_override_image %}
    <img class="site-logo" src="{{ request.participation.contest.logo_override_image|camo }}" alt="{{ SITE_NAME }}" height="40">
{% elif logo_override_image is defined and logo_override_image %}
    <img class="site-logo" src="{{ logo_override_image|camo }}" alt="{{ SITE_NAME }}" height="40" style="border: none">
{% else %}
    <img class="site-logo" src="{{ static('icons/logo.png') }}" alt="{{ SITE_NAME }}" width="100" height="40" style="border: none">
{% endif %}
