worker_processes auto;
pid /run/dmoj-nginx/nginx.pid;
error_log stderr warn;
worker_shutdown_timeout 10s;
events { worker_connections 768; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    gzip on;
    access_log syslog:server=unix:/run/systemd/journal/dev-log,tag=dmoj_nginx,nohostname combined;

    # Request bodies larger than the in-memory buffer are written here. It is on
    # disk on purpose: /run is usually a tmpfs, which is RAM. The directory is
    # created by StateDirectory= in the service unit.
    client_body_temp_path /var/lib/dmoj-nginx/client;
    proxy_temp_path /run/dmoj-nginx/proxy;
    fastcgi_temp_path /run/dmoj-nginx/fastcgi;
    uwsgi_temp_path /run/dmoj-nginx/uwsgi;
    scgi_temp_path /run/dmoj-nginx/scgi;

    server {
        listen 127.0.0.1:8082 default_server;
        listen [::1]:8082 default_server;
        server_name judge.example.org www.judge.example.org;

        # Everything is capped here; the two locations below raise or lower it.
        client_max_body_size 16M;

        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
        charset utf-8;

        try_files $uri @icons;
        error_page 502 504 /502.html;

        location ~ ^/502\.html$|^/logo\.png$|^/robots\.txt$ {
            root /srv/dmoj/site;
        }

        location @icons {
            root /srv/dmoj/site/resources/icons;
            error_page 403 = @uwsgi;
            error_page 404 = @uwsgi;
        }

        location /martor/ {
            alias /srv/dmoj/media/;
            autoindex off;
            expires max;
        }

        location @uwsgi {
            uwsgi_read_timeout 600s;
            uwsgi_pass unix:///run/dmoj-web/site.sock;
            include /etc/nginx/uwsgi_params;
            uwsgi_param SERVER_SOFTWARE nginx/$nginx_version;
            uwsgi_connect_timeout 60s;
            uwsgi_send_timeout 60s;
            uwsgi_buffer_size 32k;
            uwsgi_buffering on;
            uwsgi_buffers 16 64k;
            uwsgi_busy_buffers_size 128k;
            uwsgi_max_temp_file_size 128m;
        }

        # Problem data archives are large; this is the only route above 16M.
        # Nginx reads the whole body before the application sees it, so before
        # reading anything it asks the application, through auth_request, whether
        # this caller could upload problem data at all. Anonymous users and
        # accounts without the permission get 403 without a byte being buffered.
        location ~ ^/problem/[^/]+/test_data$ {
            client_max_body_size 500M;
            auth_request /internal/problem-data-upload-gate;
            try_files $uri @uwsgi_upload;
        }

        location = /internal/problem-data-upload-gate {
            internal;
            # The subrequest inherits the Content-Length of the upload, and a body
            # limit here would be checked against it even though the body is never
            # sent. With the inherited 16M every real upload would fail with 500.
            # Zero is safe because uwsgi_pass_request_body is off.
            client_max_body_size 0;
            uwsgi_pass unix:///run/dmoj-web/site.sock;
            include /etc/nginx/uwsgi_params;
            uwsgi_param SERVER_SOFTWARE nginx/$nginx_version;
            # The session cookie travels with the subrequest; the body never does.
            uwsgi_pass_request_body off;
            uwsgi_param CONTENT_LENGTH "";
            uwsgi_param CONTENT_TYPE "";
            uwsgi_param REQUEST_METHOD GET;
            uwsgi_connect_timeout 10s;
            uwsgi_send_timeout 10s;
            uwsgi_read_timeout 15s;
        }

        location @uwsgi_upload {
            client_max_body_size 500M;
            uwsgi_read_timeout 600s;
            uwsgi_pass unix:///run/dmoj-web/site.sock;
            include /etc/nginx/uwsgi_params;
            uwsgi_param SERVER_SOFTWARE nginx/$nginx_version;
            uwsgi_connect_timeout 60s;
            uwsgi_send_timeout 600s;
            uwsgi_buffering on;
            uwsgi_max_temp_file_size 512m;
        }

        location = /custom-test/run/ {
            client_max_body_size 2M;
            try_files $uri @icons;
        }

        # Keep the trailing slash on both sides. With `location /static` and an
        # alias ending in `/`, a request for `/static../X` is served from
        # `/srv/dmoj/site/X`: any file of the checkout, settings included.
        location /static/ {
            alias /srv/dmoj/site/static/;
            autoindex off;
            expires max;
        }

        location /event/ {
            proxy_pass http://127.0.0.1:15100/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        location /channels/ {
            proxy_read_timeout 120;
            proxy_pass http://127.0.0.1:15102;
        }
    }
}
